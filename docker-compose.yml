services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dishpatch
    ports:
      - "5434:5432"          # 5434 on your Mac, so it doesn't clash with the course DB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/data/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d dishpatch"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:6.4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:800"            # open http://localhost:5050:800
    depends_on:
      - db

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/dishpatch
    ports:
      - "8000:8000"          # open http://localhost:8000/docs
    volumes:
      - ./src:/app/src       # code changes reload without rebuilding
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: